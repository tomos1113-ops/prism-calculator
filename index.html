
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プリズム合成計算</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
      background: #f7f8fa;
    }

    h1 {
      font-size: 1.5rem;
    }

    .description,
    .note {
      color: #555;
      font-size: 0.9rem;
    }

    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      font-size: 1rem;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: white;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 8px;
    }

    .calculate {
      background: #175cd3;
      color: white;
    }

    .reset {
      background: #e9edf2;
      color: #222;
    }

    .result {
      background: #edf4ff;
      border: 1px solid #b7d0ff;
      border-radius: 12px;
      padding: 18px;
      margin-top: 16px;
    }

    .result h2 {
      font-size: 1.15rem;
      margin: 0 0 12px;
    }

    .result-value {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 5px 0 14px;
    }

    .error {
      color: #b42318;
      font-weight: bold;
      margin-top: 10px;
    }

    .direction-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .direction-table th,
    .direction-table td {
      padding: 7px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .direction-table th {
      background: #f1f3f5;
    }
  </style>
</head>

<body>
  <h1>プリズム合成計算</h1>
  <p class="description">
    水平・垂直プリズムから、合成プリズム量と検眼枠上の角度を計算します。
  </p>

  <div class="panel">
    <div class="field">
      <label for="eye">眼の選択</label>
      <select id="eye">
        <option value="OD">右眼（OD）</option>
        <option value="OS">左眼（OS）</option>
      </select>
    </div>

    <div class="field">
      <label>水平プリズム</label>
      <div class="input-row">
        <div>
          <label for="horizontal" style="font-weight:normal">
            プリズム量（Δ）
          </label>
          <input id="horizontal" type="number"
                 min="0" step="0.1" value="0">
        </div>
        <div>
          <label for="horizontalDirection" style="font-weight:normal">
            基底方向
          </label>
          <select id="horizontalDirection">
            <option value="BO">BO（耳側）</option>
            <option value="BI">BI（鼻側）</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label>垂直プリズム</label>
      <div class="input-row">
        <div>
          <label for="vertical" style="font-weight:normal">
            プリズム量（Δ）
          </label>
          <input id="vertical" type="number"
                 min="0" step="0.1" value="0">
        </div>
        <div>
          <label for="verticalDirection" style="font-weight:normal">
            基底方向
          </label>
          <select id="verticalDirection">
            <option value="BU">BU（上方）</option>
            <option value="BD">BD（下方）</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="magnitudeDigits">合成プリズム量の表示桁数</label>
      <select id="magnitudeDigits">
        <option value="2">小数点第2位まで</option>
        <option value="1">小数点第1位まで</option>
        <option value="0">整数</option>
      </select>
    </div>

    <div class="field">
      <label for="angleDigits">角度の表示桁数</label>
      <select id="angleDigits">
        <option value="2">小数点第2位まで</option>
        <option value="1">小数点第1位まで</option>
        <option value="0">整数</option>
      </select>
    </div>

    <button type="button" class="calculate" id="calculate">
      計算する
    </button>
    <button type="button" class="reset" id="reset">
      リセット
    </button>

    <div id="error" class="error" role="alert"></div>

    <div class="result" aria-live="polite">
      <h2>計算結果</h2>
      <div>合成プリズム量</div>
      <div class="result-value" id="magnitude">0.00 Δ</div>
      <div>角度（検者から見た検眼枠上）</div>
      <div class="result-value" id="angle">—</div>
      <div id="direction">合成プリズムなし（方向なし）</div>
    </div>
  </div>

  <div class="panel">
    <strong>角度の定義</strong>
    <table class="direction-table">
      <thead>
        <tr>
          <th>検眼枠上の方向</th>
          <th>角度</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>検者から見て右側</td><td>0°</td></tr>
        <tr><td>上方</td><td>90°</td></tr>
        <tr><td>検者から見て左側</td><td>180°</td></tr>
        <tr><td>下方</td><td>270°</td></tr>
      </tbody>
    </table>
    <p class="note">
      角度は反時計回りに増加します。右眼・左眼で耳側と鼻側の左右関係が異なるため、
      水平成分の符号を眼の選択に応じて変換します。
    </p>
  </div>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    // 指定桁数で四捨五入する
    function roundHalfUp(value, digits) {
      const factor = 10 ** digits;
      const rounded =
        Math.floor(Math.abs(value) * factor + 0.5000000001) / factor;
      return value < 0 ? -rounded : rounded;
    }

    // 指定桁数で表示する（末尾の0も表示）
    function formatRounded(value, digits) {
      return roundHalfUp(value, digits).toFixed(digits);
    }

    function calculate() {
      $("error").textContent = "";

      const eye = $("eye").value;
      const hText = $("horizontal").value.trim();
      const vText = $("vertical").value.trim();
      const h = Number(hText);
      const v = Number(vText);
      const hDir = $("horizontalDirection").value;
      const vDir = $("verticalDirection").value;

      if (
        hText === "" ||
        vText === "" ||
        !Number.isFinite(h) ||
        !Number.isFinite(v) ||
        h < 0 ||
        v < 0
      ) {
        $("error").textContent =
          "水平・垂直プリズム量には、0以上の数値を入力してください。";
        $("magnitude").textContent = "—";
        $("angle").textContent = "—";
        $("direction").textContent = "";
        return;
      }

      /*
       * 検者から見た右側を +X、左側を -X、
       * 上方を +Y、下方を -Y とする。
       *
       * OD：BOは検者から見て左、BIは右。
       * OS：BOは検者から見て右、BIは左。
       */
      let x;

      if (eye === "OD") {
        x = hDir === "BO" ? -h : h;
      } else {
        x = hDir === "BO" ? h : -h;
      }

      const y = vDir === "BU" ? v : -v;
      const magnitude = Math.hypot(x, y);

      // 0Δでは方向角は定義しない
      const magnitudeDigits = Number($("magnitudeDigits").value);
      const angleDigits = Number($("angleDigits").value);

      $("magnitude").textContent =
        formatRounded(magnitude, magnitudeDigits) + " Δ";

      if (magnitude === 0) {
        $("angle").textContent = "—";
        $("direction").textContent = "合成プリズムなし（方向なし）";
        return;
      }

      let angle = Math.atan2(y, x) * 180 / Math.PI;
      angle = (angle + 360) % 360;

      $("angle").textContent =
        formatRounded(angle, angleDigits) + "°";

      const horizontalText =
        x > 0 ? "右" : x < 0 ? "左" : "";
      const verticalText =
        y > 0 ? "上" : y < 0 ? "下" : "";

      if (horizontalText && verticalText) {
        $("direction").textContent =
          "検眼枠上：" + horizontalText + verticalText + "方向";
      } else if (horizontalText) {
        $("direction").textContent =
          "検眼枠上：" + horizontalText + "方向";
      } else {
        $("direction").textContent =
          "検眼枠上：" + verticalText + "方向";
      }
    }

    function reset() {
      // 水平・垂直の値を0にする
      $("horizontal").value = "0";
      $("vertical").value = "0";

      // その他の選択項目も初期設定に戻す
      $("eye").value = "OD";
      $("horizontalDirection").value = "BO";
      $("verticalDirection").value = "BU";
      $("magnitudeDigits").value = "2";
      $("angleDigits").value = "2";

      // 結果をすぐに更新
      calculate();
    }

    $("calculate").addEventListener("click", calculate);
    $("reset").addEventListener("click", reset);

    // 入力や選択を変更したときも自動計算
    [
      "eye",
      "horizontal",
      "horizontalDirection",
      "vertical",
      "verticalDirection",
      "magnitudeDigits",
      "angleDigits"
    ].forEach(id => {
      $(id).addEventListener("input", calculate);
      $(id).addEventListener("change", calculate);
    });

    // 起動時は0Δから開始
    calculate();
  </script>
</body>
</html>
