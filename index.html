
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>プリズム合成計算</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
      background: #f7f8fa;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .description {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .panel {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select,
    input {
      width: 100%;
      font-size: 1rem;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: white;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 8px;
    }

    .calculate {
      background: #175cd3;
      color: white;
    }

    .reset {
      background: #e9edf2;
      color: #222;
    }

    .result {
      background: #edf4ff;
      border: 1px solid #b7d0ff;
      border-radius: 12px;
      padding: 18px;
      margin-top: 16px;
    }

    .result h2 {
      font-size: 1.15rem;
      margin: 0 0 12px;
    }

    .result-value {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 5px 0;
    }

    .result-detail {
      font-size: 0.95rem;
      margin-top: 10px;
    }

    .error {
      color: #b42318;
      font-weight: bold;
      margin-top: 10px;
    }

    .note {
      color: #555;
      font-size: 0.85rem;
      margin-top: 12px;
    }

    .direction-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .direction-table th,
    .direction-table td {
      padding: 7px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .direction-table th {
      background: #f1f3f5;
    }
  </style>
</head>

<body>
  <h1>プリズム合成計算</h1>
  <p class="description">
    水平・垂直プリズムから、合成プリズム量と検眼枠上の角度を計算します。
  </p>

  <div class="panel">
    <div class="field">
      <label for="eye">眼の選択</label>
      <select id="eye">
        <option value="OD">右眼（OD）</option>
        <option value="OS">左眼（OS）</option>
      </select>
    </div>

    <div class="field">
      <label>水平プリズム</label>
      <div class="input-row">
        <div>
          <label for="horizontal" style="font-weight:normal">プリズム量（Δ）</label>
          <input id="horizontal" type="number" min="0" step="0.1" value="3">
        </div>
        <div>
          <label for="horizontalDirection" style="font-weight:normal">基底方向</label>
          <select id="horizontalDirection">
            <option value="BO">BO（耳側）</option>
            <option value="BI">BI（鼻側）</option>
          </select>
        </div>
      </div>
    </div>

    <div class="field">
      <label>垂直プリズム</label>
      <div class="input-row">
        <div>
          <label for="vertical" style="font-weight:normal">プリズム量（Δ）</label>
          <input id="vertical" type="number" min="0" step="0.1" value="4">
        </div>
        <div>
          <label for="verticalDirection" style="font-weight:normal">基底方向</label>
          <select id="verticalDirection">
            <option value="BU">BU（上方）</option>
            <option value="BD">BD（下方）</option>
          </select>
        </div>
      </div>
    </div>

    <button class="calculate" id="calculate">計算する</button>
    <button class="reset" id="reset">リセット</button>

    <div id="error" class="error" role="alert"></div>

    <div class="result" id="result" aria-live="polite">
      <h2>計算結果</h2>
      <div>合成プリズム量</div>
      <div class="result-value" id="magnitude">5.00 Δ</div>
      <div>角度（検者から見た検眼枠上）</div>
      <div class="result-value" id="angle">126.87°</div>
      <div class="result-detail" id="direction">検眼枠上：左上方向</div>
    </div>
  </div>

  <div class="panel">
    <strong>角度の定義</strong>
    <table class="direction-table">
      <thead>
        <tr>
          <th>検眼枠上の方向</th>
          <th>角度</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>検者から見て右側</td><td>0°</td></tr>
        <tr><td>上方</td><td>90°</td></tr>
        <tr><td>検者から見て左側</td><td>180°</td></tr>
        <tr><td>下方</td><td>270°</td></tr>
      </tbody>
    </table>
    <p class="note">
      角度は反時計回りに増加します。右眼・左眼で耳側と鼻側の左右関係が異なるため、
      水平成分の符号は眼の選択に応じて変換します。
    </p>
  </div>

  <script>
    "use strict";

    const eyeInput = document.getElementById("eye");
    const horizontalInput = document.getElementById("horizontal");
    const horizontalDirectionInput =
      document.getElementById("horizontalDirection");
    const verticalInput = document.getElementById("vertical");
    const verticalDirectionInput =
      document.getElementById("verticalDirection");

    const magnitudeOutput = document.getElementById("magnitude");
    const angleOutput = document.getElementById("angle");
    const directionOutput = document.getElementById("direction");
    const errorOutput = document.getElementById("error");

    function calculate() {
      errorOutput.textContent = "";

      const eye = eyeInput.value;
      const horizontal = Number(horizontalInput.value);
      const vertical = Number(verticalInput.value);
      const horizontalDirection = horizontalDirectionInput.value;
      const verticalDirection = verticalDirectionInput.value;

      if (
        horizontalInput.value.trim() === "" ||
        verticalInput.value.trim() === "" ||
        !Number.isFinite(horizontal) ||
        !Number.isFinite(vertical) ||
        horizontal < 0 ||
        vertical < 0
      ) {
        errorOutput.textContent =
          "プリズム量は0以上の数値を入力してください。";
        return;
      }

      /*
       * 座標系：
       * 検者から見て右側を +X、左側を -X、
       * 上方を +Y、下方を -Y とする。
       *
       * OD：BOは検者から見て左、BIは右。
       * OS：BOは検者から見て右、BIは左。
       */

      let x;

      if (eye === "OD") {
        x = horizontalDirection === "BO"
          ? -horizontal
          : horizontal;
      } else {
        x = horizontalDirection === "BO"
          ? horizontal
          : -horizontal;
      }

      const y = verticalDirection === "BU"
        ? vertical
        : -vertical;

      const magnitude = Math.hypot(x, y);

      let angle = Math.atan2(y, x) * 180 / Math.PI;
      angle = (angle + 360) % 360;

      // 浮動小数点誤差による360°表示を避ける
      if (Math.abs(angle - 360) < 1e-10) {
        angle = 0;
      }

      magnitudeOutput.textContent = magnitude.toFixed(2) + " Δ";
      angleOutput.textContent = angle.toFixed(2) + "°";

      let directionText;

      if (magnitude === 0) {
        directionText = "合成プリズムなし（方向なし）";
      } else {
        const horizontalText =
          x > 0 ? "右" :
          x < 0 ? "左" : "";

        const verticalText =
          y > 0 ? "上" :
          y < 0 ? "下" : "";

        if (horizontalText && verticalText) {
          directionText =
            "検眼枠上：" + horizontalText + verticalText + "方向";
        } else if (horizontalText) {
          directionText =
            "検眼枠上：" + horizontalText + "方向";
        } else if (verticalText) {
          directionText =
            "検眼枠上：" + verticalText + "方向";
        } else {
          directionText = "合成プリズムなし";
        }
      }

      directionOutput.textContent = directionText;
    }

    function reset() {
      eyeInput.value = "OD";
      horizontalInput.value = "3";
      horizontalDirectionInput.value = "BO";
      verticalInput.value = "4";
      verticalDirectionInput.value = "BU";
      calculate();
    }

    document.getElementById("calculate").addEventListener("click", calculate);
    document.getElementById("reset").addEventListener("click", reset);

    calculate();
  </script>
</body>
</html>
